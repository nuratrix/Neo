[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-neo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx", "pydantic>=2", "boto3"]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.2,<2"]  # server uses the 1.x FastMCP API (renamed in 2.x)
dev  = ["pytest"]
agent = ["project-neo[mcp]", "anthropic[mcp]", "python-dotenv", "ipykernel"]  # neo_mcp/neo_agent.ipynb

[project.scripts]
neo = "neo_core.cli:main"

[tool.setuptools]
packages = ["neo_core"]

[tool.setuptools.package-dir]
"neo_core" = "neo_core"
